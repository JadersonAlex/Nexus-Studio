<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DMC Studio — Devil May Cry Saga Brasil</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;500;600&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg0:#050810;--bg1:#0a1120;--bg2:#0e1a30;--cy:#4cc9f0;--vi:#8b7cf6;--mg:#e81ee0;--t0:#f5f8fc;--t1:#a9b8cf;--t2:#6b7a92;--gl:rgba(255,255,255,.045);--bd:rgba(255,255,255,.1);--ok:#34d399;--er:#fb7185;color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg0:#050810}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg0);color:var(--t0);font:14px Inter,system-ui,sans-serif;overflow:hidden}
body{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);background:radial-gradient(ellipse 60% 45% at 20% 0,rgba(76,201,240,.12),transparent 60%),radial-gradient(ellipse 55% 50% at 90% 10%,rgba(139,124,246,.12),transparent 60%),var(--bg0)}
#app{height:100%;display:grid;grid-template-rows:60px 1fr;grid-template-columns:264px 1fr 330px}
header{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--bd);background:rgba(10,17,32,.7);backdrop-filter:blur(14px)}
header img{height:34px}.brand{font:800 18px 'Bricolage Grotesque';letter-spacing:.04em}.brand i{font-style:normal;color:var(--cy)}
.chip{padding:4px 10px;border:1px solid var(--bd);border-radius:99px;color:var(--t1);font-size:12px;display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--t2)}.dirty .dot{background:#fbbf24;box-shadow:0 0 8px #fbbf24}
.sp{flex:1}
button,select{font:inherit;color:var(--t0);cursor:pointer}
.btn{background:var(--gl);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;transition:.2s}
.btn:hover:not(:disabled){border-color:var(--cy);box-shadow:0 0 18px rgba(76,201,240,.2)}.btn:disabled{opacity:.35;cursor:default}
.pri{background:linear-gradient(135deg,var(--cy),var(--vi));color:#04101c;font-weight:700;border:0}
aside{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
#left{border-right:1px solid var(--bd)}#right{border-left:1px solid var(--bd);background:rgba(10,17,32,.45)}
h3{font:700 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--t2);margin:6px 0 2px}
.card{position:relative;border:1px solid var(--bd);border-radius:14px;padding:8px;background:var(--gl);cursor:pointer;transition:.25s;text-align:left}
.card:hover{transform:translateY(-2px);border-color:rgba(76,201,240,.5)}
.card.on{border-color:var(--cy);box-shadow:0 0 0 1px var(--cy),0 8px 30px rgba(76,201,240,.18)}
.card canvas{width:100%;border-radius:8px;display:block}.card b{display:block;margin-top:6px;font-weight:600;font-size:13px}.card small{color:var(--t2)}
.card.lock{opacity:.5;cursor:not-allowed}.card.lock .ph{aspect-ratio:1;border:1px dashed var(--bd);border-radius:8px;display:grid;place-items:center;color:var(--t2);font-size:12px;text-align:center;padding:8px}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;gap:8px;align-items:center;padding:10px 14px;color:var(--t1);font-size:12px}
#stage{flex:1;overflow:auto;display:grid;padding:24px;background:repeating-conic-gradient(#080d18 0 25%,#0a1020 0 50%) 0 0/24px 24px}
#wrap{margin:auto;position:relative;box-shadow:0 0 0 1px var(--bd),0 30px 90px rgba(0,0,0,.7),0 0 80px rgba(139,124,246,.18)}
#cv{display:block;cursor:grab;touch-action:none}
label{display:block;color:var(--t1);font-size:12px;margin:8px 0 4px}
input[type=text],textarea{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--bd);border-radius:10px;color:var(--t0);padding:10px;font:inherit;resize:vertical;outline:0}
input:focus,textarea:focus{border-color:var(--cy);box-shadow:0 0 0 3px rgba(76,201,240,.15)}
input[type=range]{width:100%;accent-color:var(--cy)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.cnt{font-size:11px;color:var(--t2)}.warn{color:#fbbf24}
.drop{border:1.5px dashed var(--bd);border-radius:12px;padding:16px;text-align:center;color:var(--t1);cursor:pointer;transition:.2s}
.drop:hover,.drop.ov{border-color:var(--cy);background:rgba(76,201,240,.06)}
.drop img{max-width:100%;max-height:90px;border-radius:8px;display:block;margin:0 auto 6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--bg2);border:1px solid var(--bd);padding:10px 16px;border-radius:12px;transition:.3s;z-index:9;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}#toast.err{border-color:var(--er);color:var(--er)}
#ld{position:fixed;inset:0;background:rgba(5,8,16,.7);display:none;place-items:center;z-index:8;color:var(--cy)}#ld.on{display:grid}
dialog{margin:auto;background:var(--bg1);color:var(--t0);border:1px solid var(--bd);border-radius:18px;padding:22px;width:min(760px,94vw)}
dialog::backdrop{background:rgba(2,4,10,.8);backdrop-filter:blur(6px)}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:20px}#pv{width:100%;border-radius:10px;border:1px solid var(--bd)}
select{background:rgba(0,0,0,.35);border:1px solid var(--bd);border-radius:10px;padding:9px;width:100%}
@media(max-width:1100px){#app{grid-template-columns:1fr 300px;grid-template-rows:60px auto 1fr}#left{grid-column:1/-1;flex-direction:row;overflow-x:auto;border:0;border-bottom:1px solid var(--bd);padding:10px}#left h3{display:none}.card{flex:0 0 120px}#right{grid-row:3;grid-column:2}main{grid-row:3}.brand span{display:none}}
@media(max-width:700px){.mg{grid-template-columns:1fr}}
</style></head><body>

 ic.forEach((k,i)=>{const cx=s.x+z/2+i*(z+g),cy=s.y+z/2;c.fillStyle=col;c.beginPath();c.arc(cx,cy,z/2,0,7);c.fill();c.strokeStyle=c.fillStyle='#1a1a3c';c.lineWidth=3.2;c.lineCap='round';
  if(k==='ig'){c.beginPath();c.roundRect(cx-11,cy-11,22,22,7);c.stroke();c.beginPath();c.arc(cx,cy,5,0,7);c.stroke();c.beginPath();c.arc(cx+7,cy-7,1.3,0,7);c.fill()}
  else if(k==='wa'){c.beginPath();c.arc(cx,cy,12,.9,6.2+.1);c.stroke();c.beginPath();c.moveTo(cx-10,cy+13);c.lineTo(cx-8,cy+6);c.stroke()}
  else{c.font='800 26px Poppins';c.textAlign='center';c.textBaseline='middle';c.fillText(k==='fb'?'f':'X',cx,cy+1);c.textAlign='left'}});
 const w=s.n*z+(s.n-1)*g;c.font='400 22px Poppins';c.fillStyle='#cfe3f2';c.textBaseline='middle';
 const ty=s.y+z+24;let tx=s.x;if(s.la==='right'){c.textAlign='right';tx=s.lx}else if(s.la==='center'){c.textAlign='center';tx=s.x+w/2}
 c.fillText('Devil May Cry Saga Brasil',tx,ty);c.textAlign='left'}
function bbox(p){const xs=p.map(a=>a[0]),ys=p.map(a=>a[1]);return[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]}
function render(c,t,S,sc){c.setTransform(sc,0,0,sc,0,0);c.clearRect(0,0,t.w,t.h);c.fillStyle=t.bg;c.fillRect(0,0,t.w,t.h);
 const g=c.createRadialGradient(t.w*.2,t.h*.2,0,t.w*.2,t.h*.2,t.w);g.addColorStop(0,'rgba(60,50,130,.35)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,t.w,t.h);
 const [x0,y0,x1,y1]=bbox(t.poly);c.save();c.beginPath();t.poly.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.closePath();c.clip();
 if(S.img){const bw=x1-x0,bh=y1-y0,im=S.img,k=Math.max(bw/im.width,bh/im.height)*S.zoom,w=im.width*k,h=im.height*k;c.drawImage(im,x0+(bw-w)/2+S.ox,y0+(bh-h)/2+S.oy,w,h)}
 else{const q=c.createLinearGradient(x0,y0,x1,y1);q.addColorStop(0,'#3b1670');q.addColorStop(1,'#a21fc0');c.fillStyle=q;c.fillRect(x0,y0,x1-x0,y1-y0);c.fillStyle='rgba(255,255,255,.75)';c.font='600 26px Poppins';c.textAlign='center';c.textBaseline='middle';c.fillText('Carregue a imagem da notícia',(x0+x1)/2,(y0+y1)/2);c.textAlign='left'}
 c.restore();
 c.fillStyle='#24215a';c.beginPath();c.arc(t.blob[0],t.blob[1],t.blob[2],0,7);c.fill();
 (t.dots||[]).forEach(d=>dots(c,d));(t.plus||[]).forEach(p=>plus(c,...p));
 c.save();c.lineWidth=9;c.lineCap='round';(t.lines||[]).forEach(l=>{c.strokeStyle=l[4];c.shadowColor=l[4];c.shadowBlur=22;c.beginPath();c.moveTo(l[0],l[1]);c.lineTo(l[2],l[3]);c.stroke()});c.restore();
 if(LOGO.complete&&LOGO.naturalWidth){const [lx,ly,lw]=t.logo;c.drawImage(LOGO,lx,ly,lw,lw*LOGO.naturalHeight/LOGO.naturalWidth)}
 const tc=t.col||'#5bbfe8',r={};c.save();c.shadowColor='rgba(30,144,255,.85)';c.shadowBlur=26;r.t=block(c,t.title,S.title??t.title.d,'700',tc,tc,t.title.up);c.restore();
 r.s=t.sub?block(c,t.sub,S.sub??t.sub.d,'800','#fff',tc):0;r.d=block(c,t.desc,S.desc??t.desc.d,'600','#fff',tc);social(c,t.soc,tc);return r}
const cv=$('cv'),cx=cv.getContext('2d');let raf=0;
function draw(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{const t=T(),d=Math.min(window.devicePixelRatio||1,2),sc=view*d;
 cv.width=Math.round(t.w*sc);cv.height=Math.round(t.h*sc);cv.style.width=t.w*view+'px';cv.style.height=t.h*view+'px';
 const r=render(cx,t,st,sc);$('zl').textContent=Math.round(view*100)+'%';
 [['ti','title','tc',r.t],['sb','sub','sc',r.s],['ds','desc','dc',r.d]].forEach(([i,k,c,o])=>{const n=$(i).value.length;$(c).innerHTML=n+(o?' · <span class=warn>texto longo: fonte reduzida</span>':'');});
 $('dr').firstElementChild.innerHTML=st.imgUrl?`<img src="${st.imgUrl}" alt=""><small>Imagem carregada</small>`:'Carregar imagem<br><small>PNG, JPG ou WebP — ou arraste aqui</small>';
 $('zv').textContent=Math.round(st.zoom*100)+'%';$('un').disabled=hi<=0;$('re').disabled=hi>=hist.length-1;document.body.classList.toggle('dirty',dirty);$('chip').classList.toggle('dirty',dirty)})}
function fit(){const s=$('stage'),t=T();view=Math.max(.2,Math.min((s.clientWidth-48)/t.w,(s.clientHeight-48)/t.h,1.5));draw()}
function snap(){const o={...st};hist=hist.slice(0,hi+1);hist.push(o);if(hist.length>80)hist.shift();hi=hist.length-1}
let tm;function touch(){dirty=true;clearTimeout(tm);tm=setTimeout(()=>{snap();draw()},450);draw()}
function sync(){const t=T();$('tname').textContent=t.name;$('ti').value=val('title');$('sb').value=val('sub');$('ds').value=val('desc');$('sbw').style.display=t.sub?'':'none';
 $('zm').value=st.zoom;$('ox').value=st.ox;$('oy').value=st.oy;document.querySelectorAll('.card').forEach(c=>c.classList.toggle('on',+c.dataset.id===st.tid))}
function toast(m,e){const t=$('toast');t.textContent=m;t.className='on'+(e?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='',3200)}
// biblioteca
const left=$('left');TPL.forEach(t=>{const b=document.createElement('button');b.className='card'+(t.lock?' lock':'');b.dataset.id=t.id;
 if(t.lock){b.innerHTML=`<div class="ph">Aguardando modelo de arte</div><b>${t.name}</b><small>Estrutura pronta para receber o modelo</small>`;b.onclick=()=>toast('Template 5 aguarda o envio do modelo.')}
 else{const c=document.createElement('canvas');c.width=300;c.height=Math.round(300*t.h/t.w);b._c=c;b.append(c);b.insertAdjacentHTML('beforeend',`<b>${t.name}</b><small>${t.w} × ${t.h}</small>`);
  b.onclick=()=>{if(st.tid===t.id)return;st.tid=t.id;st.ox=st.oy=0;snap();sync();fit()}}left.append(b)});
function thumbs(){document.querySelectorAll('.card').forEach(b=>{if(b._c){const t=TPL.find(x=>x.id==b.dataset.id);render(b._c.getContext('2d'),t,{title:null,sub:null,desc:null,img:st.img,zoom:st.zoom,ox:st.ox*.3,oy:st.oy*.3},300/t.w)}})}
// campos
[['ti','title'],['sb','sub'],['ds','desc']].forEach(([i,k])=>$(i).oninput=e=>{st[k]=e.target.value;touch()});
[['zm','zoom'],['ox','ox'],['oy','oy']].forEach(([i,k])=>$(i).oninput=e=>{st[k]=+e.target.value;touch()});
$('ce').onclick=()=>{st.ox=st.oy=0;st.zoom=1;sync();touch()};
// imagem
async function load(f){if(!f)return;if(!/^image\/(png|jpe?g|webp)$/.test(f.type))return toast('Formato inválido. Use PNG, JPG ou WebP.',1);
 if(f.size>40e6)return toast('Imagem acima de 40 MB.',1);$('ld').classList.add('on');
 try{const u=URL.createObjectURL(f),im=new Image();im.src=u;await im.decode();st.img=im;st.imgUrl=u;st.ox=st.oy=0;st.zoom=1;sync();snap();dirty=true;thumbs();draw();toast('Imagem aplicada.')}
 catch(e){toast('Não foi possível ler esta imagem.',1)}$('ld').classList.remove('on')}
$('dr').onclick=$('rp').onclick=()=>$('fi').click();$('fi').onchange=e=>{load(e.target.files[0]);e.target.value=''};
$('dr').ondragover=e=>{e.preventDefault();$('dr').classList.add('ov')};$('dr').ondragleave=()=>$('dr').classList.remove('ov');
$('dr').ondrop=e=>{e.preventDefault();$('dr').classList.remove('ov');load(e.dataTransfer.files[0])};
$('rm').onclick=()=>{st.img=null;st.imgUrl=null;snap();dirty=true;thumbs();draw()};
let drag=null;cv.onpointerdown=e=>{if(!st.img)return;drag={x:e.clientX,y:e.clientY,ox:st.ox,oy:st.oy};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'};
cv.onpointermove=e=>{if(!drag)return;st.ox=Math.max(-500,Math.min(500,drag.ox+(e.clientX-drag.x)/view));st.oy=Math.max(-500,Math.min(500,drag.oy+(e.clientY-drag.y)/view));$('ox').value=st.ox;$('oy').value=st.oy;draw()};
cv.onpointerup=()=>{if(drag){drag=null;cv.style.cursor='grab';touch()}};
// zoom, histórico
$('zi').onclick=()=>{view=Math.min(3,view*1.2);draw()};$('zo').onclick=()=>{view=Math.max(.15,view/1.2);draw()};$('zf').onclick=fit;
function go(i){if(i<0||i>=hist.length)return;hi=i;st={...hist[i]};dirty=true;sync();thumbs();draw()}
$('un').onclick=()=>go(hi-1);$('re').onclick=()=>go(hi+1);
$('rs').onclick=()=>{if(confirm('Redefinir o template? Textos e ajustes de imagem serão perdidos.')){st={...st,title:null,sub:null,desc:null,img:null,imgUrl:null,zoom:1,ox:0,oy:0};snap();dirty=false;sync();thumbs();draw()}};
addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey))return;const k=e.key.toLowerCase();if(k==='s'){e.preventDefault();openX()}else if(!/TEXTAREA|INPUT/.test(e.target.tagName)&&(k==='z'||k==='y')){e.preventDefault();k==='y'||e.shiftKey?go(hi+1):go(hi-1)}});
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});addEventListener('resize',fit);
// exportação
const off=document.createElement('canvas');
function out(w,q,cb){const t=T(),sc=w/t.w;off.width=w;off.height=Math.round(t.h*sc);const c=off.getContext('2d');render(c,t,st,sc);c.setTransform(1,0,0,1,0,0);off.toBlob(cb,'image/jpeg',q/100)}
function prev(){const t=T();$('inf').textContent=`${t.name} · proporção ${t.w}:${t.h}`;$('nw').textContent=st.img?'':'Aviso: nenhuma imagem foi carregada.';
 out(Math.min(+$('rw').value,720),+$('q').value,()=>{$('pv').src=off.toDataURL('image/jpeg',.9)});
 const w=+$('rw').value;out(w,+$('q').value,b=>$('sz').textContent=`${w} × ${Math.round(t.h*w/t.w)} px · ≈ ${(b.size/1048576).toFixed(2)} MB`)}
function openX(){$('dlg').showModal();prev()}$('sv').onclick=$('sv2').onclick=openX;$('cn').onclick=()=>$('dlg').close();
$('q').oninput=()=>{$('qv').textContent=$('q').value;prev()};$('rw').onchange=prev;
let DL=null;(window.claude&&claude.use?claude.use('downloads'):Promise.resolve(null)).then(d=>DL=d).catch(()=>{});
function done(){dirty=false;$('dlg').close();draw();toast('JPEG salvo com sucesso.')}
$('ok').onclick=()=>out(+$('rw').value,+$('q').value,async b=>{if(!b)return toast('Falha ao gerar o JPEG.',1);const name=`dmc-saga-brasil-noticia-${st.tid}.jpg`;
 if(DL){try{await DL.save({filename:name,data:b});done()}catch(e){if(e&&e.code==='declined')toast('Download cancelado.');else if(e&&e.code==='too_large')toast('Arquivo grande demais. Reduza a resolução ou a qualidade.',1);else toast('Não foi possível salvar: '+((e&&e.message)||'erro'),1)}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);done()});
// início
const fonts=['400','600','700','800'].map(w=>document.fonts.load(`${w} 40px Poppins`));
sync();snap();fit();Promise.all([...fonts,LOGO.decode().catch(()=>0)]).then(()=>{thumbs();fit()}).catch(()=>{thumbs();fit()});
</script></body></html>
